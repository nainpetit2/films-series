<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes cartes Pokémon</title>
<meta name="theme-color" content="#2B59C3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes cartes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.tcgdex.net">
<link rel="preconnect" href="https://assets.tcgdex.net">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE : pour un enfant de 6 ans qui ne lit pas encore : des images, des pictos, des couleurs, une voix
   IDEA : un classeur de cartes ; on photographie une carte, elle rejoint le classeur
   PICTURE : la grille des vraies cartes, sous un bandeau bleu étoilé ; un gros bouton appareil photo
   COLOUR/TYPE : bleu vif, jaune soleil, rouge ; un code couleur et un logo par type ; Fraunces + Figtree
   LAYOUT : une colonne mobile ; chaque bouton = un picto + un petit mot pour les parents */
:root{
  --bg:#eef2fb;--surface:#fff;--ink:#1b2340;--muted:#646c86;--line:#dde3f0;
  --accent:#2B59C3;--accent-soft:#e6edfc;--sun:#FFC23D;--sun-soft:#fff4d6;--red:#E5483B;
  --ok:#23a35a;--ko:#e04848;--doute:#f0962a;
  --font-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --font-body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;overscroll-behavior-y:none}
body{background:radial-gradient(120% 60% at 100% 0%,rgba(61,116,232,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

.band{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(160deg,#3D74E8,#1B3A97);color:#fff;min-height:196px;padding:18px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;box-shadow:0 12px 30px -18px rgba(27,58,151,.9)}
.band canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band>*:not(canvas){position:relative}
.band .logo{position:absolute;top:16px;left:18px;width:44px;height:44px;border-radius:28%;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.band h1{max-width:calc(100% - 118px);font-family:var(--font-display);font-weight:700;font-size:2.1rem;line-height:1.05;margin:0;text-wrap:balance}
.band .sub{font-size:.98rem;opacity:.92}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:20px;padding:10px 4px 8px;box-shadow:0 6px 18px -14px rgba(27,58,151,.6);display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;text-align:center}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stat .pic{width:36px;height:36px;flex:none}
.stat .pic svg{width:100%;height:100%}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;display:block}
.stat.tresor .v{color:#b07800}
.stat.top{grid-column:1/-1;flex-direction:row;text-align:left;gap:12px;background:linear-gradient(120deg,#fff,var(--sun-soft));padding:10px 14px}
.stat.top img{width:50px;height:70px;object-fit:cover;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.2);flex:none}
.stat.top .t{font-weight:800;font-size:1.05rem}
.stat.top .p{color:#b07800;font-weight:800;margin-left:auto;white-space:nowrap;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.stat.top .p svg{width:26px;height:26px}
.stat.top .crown{width:30px;height:30px;flex:none}

.barre{background:var(--surface);border-radius:20px;padding:8px;box-shadow:0 6px 18px -14px rgba(27,58,151,.6);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.barre::-webkit-scrollbar{display:none}
.ib{position:relative;flex:1 0 auto;min-width:58px;border:0;background:transparent;border-radius:14px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.ib .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f1f4fa;color:var(--accent);transition:transform .12s}
.ib .ic svg{width:24px;height:24px}
.ib small{font-size:11px;font-weight:700;white-space:nowrap}
.ib[aria-pressed="true"]{color:var(--ink)}
.ib[aria-pressed="true"] .ic{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.06)}
.ib.type .ic{background:var(--tc);color:#fff}
.barre.sel .ib:not([aria-pressed="true"]) .ic{opacity:.4}
.ib.type .ic svg{width:26px;height:26px}
.ib.type[aria-pressed="true"] .ic{background:var(--tc);opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--tc)}
.ib.type.tous .ic{background:#f1f4fa;color:var(--accent);opacity:1}
.ib.type.tous[aria-pressed="true"] .ic{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.ib.note .ic{color:#fff;background:var(--c)}
.ib.note[data-vf="toutes"] .ic{color:var(--accent);background:#f1f4fa}
.ib.note[data-vf="toutes"][aria-pressed="true"] .ic{color:#fff;background:var(--accent)}
.ib .nb{position:absolute;top:2px;left:calc(50% + 10px);background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:0 6px;line-height:17px}
.recherche{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 12px}
.recherche svg{width:22px;height:22px;color:var(--muted);flex:none}
.recherche input{border:0;outline:0;padding:12px 0;font-size:16px;width:100%;background:transparent}

.ti{display:inline-grid;place-items:center;border-radius:50%;flex:none;width:22px;height:22px}
.ti svg{width:64%;height:64%}

.grp{display:flex;align-items:center;gap:10px;margin:6px 2px -4px;font-weight:800}
.grp .ti{width:32px;height:32px}
.grp .etoiles{font-size:24px}
.grp .n{background:#fff;border-radius:999px;padding:1px 9px;font-size:13px;color:var(--muted);box-shadow:0 2px 6px -3px rgba(27,58,151,.5)}
.grp .gl{font-family:var(--font-display);font-size:1.1rem}
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:360px){.grille{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:560px){.grille{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tuile{position:relative;border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:5px}
.tuile .img{position:relative;aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#dfe6f6,#c9d4ee);box-shadow:0 6px 14px -8px rgba(27,58,151,.7)}
.tuile img{width:100%;height:100%;object-fit:cover;display:block}
.tuile.faux .img img{filter:grayscale(.75) brightness(.95)}
.tuile.partie .img{opacity:.55}
.tuile .ech{position:absolute;bottom:5px;left:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px;box-shadow:0 0 0 2px #fff}
.tuile .ech svg{width:13px;height:13px}
.tuile .avec{font-size:12px;font-weight:700;color:var(--accent);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.badge{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
.badge svg{width:14px;height:14px}
.qte{position:absolute;top:5px;right:5px;background:rgba(20,28,60,.85);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:2px 8px}
.tuile .tbadge{position:absolute;bottom:5px;right:5px;width:26px;height:26px;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.tuile .bas{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 2px}
.etoiles{color:var(--sun);font-size:13px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 0 rgba(150,100,0,.35)}
.etoiles.brille{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.prix{font-weight:800;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prix.zero{color:var(--muted);font-weight:600;text-decoration:line-through}
.prix.nc{color:var(--muted);font-weight:600}

.etat{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.etat strong{color:var(--ink);font-size:1.1rem}
.grosic{display:block;width:110px;height:110px}
.grosic svg{width:100%;height:100%}
.compte{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 70px;display:flex;flex-direction:column;gap:6px;align-items:center}
.compte button{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:4px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;border:5px solid #fff;border-radius:50%;background:var(--red);color:#fff;width:84px;height:84px;display:grid;place-items:center;box-shadow:0 12px 28px -8px rgba(229,72,59,.8)}
.fab svg{width:40px;height:40px}
@media(prefers-reduced-motion:no-preference){.fab{animation:respire 2.8s ease-in-out infinite}}
@keyframes respire{50%{transform:translateX(-50%) scale(1.06)}}

.voile{position:fixed;inset:0;background:rgba(15,22,48,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.voile.on{display:flex}
.feuille{background:var(--surface);width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:95%;overflow:auto;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.feuille.haute{min-height:88%}
.feuille h2{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin:0;flex:1;text-align:center}
.tete{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rond-btn{border:0;background:#eef1f7;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex:none;color:var(--ink)}
.rond-btn svg{width:22px;height:22px}
.rond-btn.voix{background:var(--accent-soft);color:var(--accent)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.res.gros{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:560px){.res{grid-template-columns:repeat(4,minmax(0,1fr))}.res.gros{grid-template-columns:repeat(3,minmax(0,1fr))}}
.res button{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:4px;text-align:left}
.res .img{position:relative;aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#dfe6f6,#c9d4ee);box-shadow:0 5px 12px -8px rgba(27,58,151,.7)}
.res img{width:100%;height:100%;object-fit:cover;display:block}
.res .n{font-size:12px;color:var(--muted);font-weight:600;padding:0 2px}
.res .deja::after{content:"✓";position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;border:2px solid #fff}
.lnk{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;font-size:14px;display:inline-flex;align-items:center;gap:6px;align-self:center}
.lnk svg{width:18px;height:18px}

.photo-zone{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0}
.photo-gros{border:0;width:min(70vw,280px);aspect-ratio:1;border-radius:40px;background:linear-gradient(160deg,#ff6a5c,#d8362a);color:#fff;display:grid;place-items:center;box-shadow:0 18px 36px -14px rgba(229,72,59,.8),inset 0 -8px 0 rgba(0,0,0,.12)}
.photo-gros svg{width:46%;height:46%}
.conseils{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.conseil{background:#f4f7fd;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.conseil svg{width:54px;height:54px}
.galerie{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 16px;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent)}
.galerie svg{width:24px;height:24px}
.scan{position:relative;width:min(62vw,240px);aspect-ratio:3/4;margin:10px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 18px 36px -16px rgba(27,58,151,.8);flex:none}
.scan img{width:100%;height:100%;object-fit:cover}
.scan::after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(255,194,61,.6),transparent);top:-30%}
@media(prefers-reduced-motion:no-preference){.scan::after{animation:balaye 1.4s linear infinite}}
@keyframes balaye{to{top:100%}}
.points{display:flex;gap:10px;justify-content:center;padding:8px}
.points i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
@media(prefers-reduced-motion:no-preference){.points i{animation:saute 1s ease-in-out infinite}.points i:nth-child(2){animation-delay:.15s}.points i:nth-child(3){animation-delay:.3s}}
@keyframes saute{50%{transform:translateY(-10px);opacity:.5}}
.oups{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.oups p{margin:0;color:var(--muted)}
.mini-photo{width:64px;height:84px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.question{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:18px;padding:10px}
.question .q{font-weight:800;font-size:1.1rem;flex:1}
.indice{background:#fff3e3;border:2px solid #ffd9a8;border-radius:16px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center}
.indice svg{width:30px;height:30px;flex:none}

.detail-img{flex:none;width:min(66%,250px);margin:0 auto;aspect-ratio:63/88;border-radius:14px;overflow:hidden;box-shadow:0 18px 36px -16px rgba(27,58,151,.8);background:linear-gradient(160deg,#dfe6f6,#c9d4ee)}
.detail-img img{width:100%;height:100%;object-fit:cover;display:block}
.detail-img.faux img{filter:grayscale(.75)}
.tuiles-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ti-info{background:#f4f7fd;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ti-info .ti{width:44px;height:44px}
.ti-info .gros{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:44px;white-space:nowrap}
.ti-info .etoiles{font-size:22px;line-height:44px}
.ti-info small{font-size:11.5px;font-weight:700;color:var(--muted)}
.cote{background:linear-gradient(120deg,var(--sun-soft),#fff);border:2px solid #ffe2a0;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.cote .coin{width:48px;height:48px;flex:none}
.cote .coin svg{width:100%;height:100%}
.cote .big{font-family:var(--font-display);font-weight:700;font-size:2rem;color:#9a6900;line-height:1;white-space:nowrap}
.cote .det{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px}
.cote .det b{color:var(--ink);font-variant-numeric:tabular-nums}
.cote a{color:var(--accent);font-weight:700}
.cote.off{background:#f4f5f8;border-color:var(--line)}
.cote.off .big{color:var(--muted)}
.vf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vf button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:11px;line-height:1.15;color:var(--muted);text-align:center}
.vf .rond{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.vf .rond svg{width:26px;height:26px}
.vf [aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--ink)}
.jauge{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:-6px}
.jauge i{height:8px;border-radius:4px;background:var(--c);opacity:.25}
.jauge i.on{opacity:1}
.vf [aria-pressed="false"] .rond{opacity:.5}
details.astuces{background:#f4f7fd;border-radius:16px;padding:10px 14px}
details.astuces summary{font-weight:800;color:var(--accent);cursor:pointer;min-height:28px;display:flex;align-items:center;gap:8px;font-size:14px}
details.astuces summary svg{width:20px;height:20px;flex:none}
details.astuces ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stepper{display:flex;align-items:center;gap:8px;justify-content:center}
.stepper button{width:56px;height:56px;border-radius:18px;border:2px solid var(--line);background:#f6f8fc;font-size:28px;font-weight:700;display:grid;place-items:center;color:var(--accent)}
.stepper .q{min-width:70px;text-align:center;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;justify-content:center}
.stepper .q svg{width:30px;height:30px}
.actions{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:16px;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:26px;height:26px;flex:none}
.btn.prim{background:var(--ok);color:#fff;flex:1;box-shadow:0 8px 18px -10px rgba(35,163,90,.9)}
.btn.bleu{background:var(--accent);color:#fff;flex:1}
.btn:disabled{opacity:.6}
.btn.sec{background:#eef1f7}
.btn.danger{background:#fdecec;color:#c0392b;min-width:58px;padding:14px}
.btn.danger.confirm{background:#c0392b;color:#fff}
.deja-la{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:2px solid #c9d8fb;border-radius:18px;padding:10px 12px;font-weight:800;color:var(--accent)}
.deja-la svg{width:44px;height:44px;flex:none}
.deja-la small{display:block;font-weight:600;color:var(--muted)}
.echange{background:#f4f7fd;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.echange h3{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.echange h3 svg{width:26px;height:26px;color:var(--accent)}
.echange label{font-size:13px;font-weight:700;color:var(--muted)}
.echange input{border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px;width:100%;background:#fff}
.echange input:focus{border-color:var(--accent);outline:0}
.copains{display:flex;flex-wrap:wrap;gap:6px}
.copains button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.copains button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.coche{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.coche input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.histo{display:flex;flex-direction:column;gap:6px}
.histo h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:8px}
.histo h3 svg{width:22px;height:22px;color:var(--accent)}
.histo div{background:#f4f7fd;border-radius:14px;padding:9px 12px;font-size:14px}
.histo b{color:var(--accent)}
.recherche{border-color:#c9d8fb;box-shadow:0 6px 18px -14px rgba(27,58,151,.6)}
.recherche .vide{border:0;background:#eef1f7;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.recherche .vide svg{width:14px;height:14px}
.champ-nom{display:flex;gap:8px}
.champ-nom input{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px}
.champ-nom input:focus{border-color:var(--accent);outline:0}
.champ-nom .num{flex:0 0 90px}

.fete{position:fixed;inset:0;z-index:40;background:rgba(15,22,48,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;padding:24px}
.fete.on{display:flex}
.fete canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fete .c{position:relative;width:min(58vw,230px);aspect-ratio:63/88;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px var(--sun),0 20px 60px rgba(255,194,61,.55)}
.fete .c img{width:100%;height:100%;object-fit:cover}
.fete h3{position:relative;font-family:var(--font-display);font-size:2rem;margin:0}
.fete .etoiles{position:relative;font-size:32px}
.fete .btn{position:relative;flex:none;width:92px;height:92px;border-radius:50%;padding:0}
.fete .btn svg{width:46px;height:46px}
@media(prefers-reduced-motion:no-preference){.fete.on .c{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}.fete.on h3{animation:rise .5s .25s ease both}.tuile .img{transition:transform .12s}.tuile:active .img{transform:scale(.97)}}

.viseur{position:fixed;inset:0;z-index:35;background:#000;display:none}
.viseur.on{display:block}
.viseur video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cadre{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(74vw,calc(58vh * 63 / 88));aspect-ratio:63/88;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);border:3px solid rgba(255,255,255,.9)}
.cadre i{position:absolute;width:34px;height:34px;border:6px solid var(--sun)}
.cadre i:nth-child(1){top:-6px;left:-6px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.cadre i:nth-child(2){top:-6px;right:-6px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.cadre i:nth-child(3){bottom:-6px;left:-6px;border-right:0;border-top:0;border-radius:0 0 0 16px}
.cadre i:nth-child(4){bottom:-6px;right:-6px;border-left:0;border-top:0;border-radius:0 0 16px 0}
@media(prefers-reduced-motion:no-preference){.cadre i{animation:clign 1.6s ease-in-out infinite}}
@keyframes clign{50%{opacity:.45}}
.v-aide{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;color:#fff;font-weight:800;font-size:1.05rem;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 70px}
.v-aide .ico{display:flex;gap:6px}
.v-aide .ico svg{width:34px;height:34px;background:rgba(255,255,255,.92);border-radius:10px;padding:3px}
.v-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.2);color:#fff}
.v-bas{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px}
.v-declic{width:86px;height:86px;border-radius:50%;border:6px solid #fff;background:var(--red);box-shadow:0 0 0 4px rgba(0,0,0,.25)}
.v-declic:active{transform:scale(.93)}
.v-bas .rond-btn{background:rgba(255,255,255,.2);color:#fff;width:52px;height:52px}
.v-bas .rond-btn svg{width:26px;height:26px}
.v-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.v-flash.on{opacity:.85;transition:none}
.voix{display:flex;flex-direction:column;gap:8px}
.voix button{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;text-align:left}
.voix button svg{width:26px;height:26px;color:var(--accent);flex:none}
.voix button small{display:block;color:var(--muted);font-size:12.5px}
.voix button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50;display:none;font-weight:600}
.toast.on{display:block}

.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 30%,#3D74E8,#142C78);color:#fff;transition:opacity .5s ease,visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:116px;height:116px;border-radius:28%;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash .sn{font-family:var(--font-display);font-size:2.2rem;font-weight:700;animation:rise .6s .15s ease both}
.splash .ss{font-size:.95rem;opacity:.8;animation:rise .6s .3s ease both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.splash-logo,.splash .sn,.splash .ss{animation:none}.splash{transition:none}}
.gate{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#3D74E8,#142C78);display:none;align-items:center;justify-content:center;padding:24px max(18px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
.gate.on{display:flex}
.gate .box{background:var(--surface);border-radius:24px;padding:22px 20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 50px -24px rgba(0,0,0,.6)}
.gate h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;color:var(--accent)}
.gate p{margin:0;color:var(--muted);font-size:15px}
.gate label{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.gate input{border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%}
.gate .err{color:#c0392b;font-size:14px;min-height:1px}
.gate .lnk{align-self:flex-start}
.gate .btn.bleu{flex:none}
.gate code{background:var(--accent-soft);border-radius:6px;padding:1px 5px;font-size:13px}
@media(max-height:700px){.band{min-height:176px}.band h1{font-size:1.85rem}}
</style>
</head>
<body>
<div class="splash" id="splash" role="presentation"><img class="splash-logo" src="logo.svg" alt=""><div class="sn">Mes cartes</div><div class="ss">Ma collection Pokémon, carte par carte</div></div>

<div class="wrap">
  <header class="band">
    <canvas id="bandArt" aria-hidden="true"></canvas>
    <img class="logo" src="logo.svg" alt="">
    <h1>Mes cartes Pokémon</h1>
    <div class="sub" id="sousTitre">Ma collection</div>
  </header>
  <div class="stats" id="stats"></div>
  <label class="recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" type="search" placeholder="Chercher : nom, type, numéro, copain…" autocomplete="off" enterkeyhint="search"><button class="vide" type="button" id="qVide" aria-label="Effacer" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></label>
  <div class="barre" id="types" aria-label="Type"></div>
  <div class="barre" id="vfFiltre" aria-label="Vraie ou fausse"></div>
  <div class="barre" id="tris" aria-label="Ranger par"></div>
  <div id="liste"></div>
  <div class="compte" id="compte"></div>
</div>

<button class="fab" id="fab" type="button" aria-label="Photographier une carte"></button>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="album" accept="image/*" hidden>

<div class="voile" id="vAjout"><div class="feuille haute" id="fAjout"></div></div>
<div class="voile" id="vDetail"><div class="feuille" id="fDetail"></div></div>
<div class="fete" id="fete" role="dialog" aria-live="polite"><canvas id="confetti"></canvas><div class="c"><img id="feteImg" alt=""></div><div class="etoiles" id="feteEt"></div><h3 id="feteTitre">Nouvelle carte !</h3><button class="btn prim" id="feteOk" aria-label="Super"></button></div>
<div class="viseur" id="viseur" role="dialog" aria-label="Photographier la carte">
  <video id="vid" playsinline muted autoplay></video>
  <div class="cadre" id="cadre"><i></i><i></i><i></i><i></i></div>
  <div class="v-aide" id="vAide"></div>
  <button class="rond-btn v-x" type="button" id="vFermer" aria-label="Fermer"></button>
  <div class="v-bas"><button class="rond-btn" type="button" id="vAlbum" aria-label="Choisir une photo" style="justify-self:start"></button><button class="v-declic" type="button" id="vDeclic" aria-label="Prendre la photo"></button><button class="rond-btn" type="button" id="vNom" aria-label="Chercher par le nom" style="justify-self:end"></button></div>
  <div class="v-flash" id="vFlash"></div>
</div>
<div class="gate" id="gate"><div class="box" id="gateBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
{
/* ---------- Pictos ---------- */
const SV = (p, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2.2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P = {
  camera: SV('<path d="M4 8h3l1.8-2.5h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.6"/>', 2.3),
  album: SV('<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/>'),

  echanges: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#e6edfc"/><path d="M12 19h21l-5-5M36 29H15l5 5" stroke="#2B59C3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  palette: '<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.4" fill="#ef6236"/><circle cx="16" cy="9" r="3.4" fill="#3a8fe0"/><circle cx="12" cy="16" r="3.4" fill="#4fae55"/></svg>',

  cards: '<svg viewBox="0 0 48 48"><rect x="8" y="10" width="20" height="28" rx="3" fill="#c9d6f5" transform="rotate(-12 18 24)"/><rect x="16" y="8" width="22" height="31" rx="3" fill="#FFC23D"/><rect x="19" y="11" width="16" height="12" rx="2" fill="#E5483B"/><rect x="19" y="26" width="16" height="2.5" rx="1.2" fill="#e8c76a"/><rect x="19" y="31" width="10" height="2.5" rx="1.2" fill="#e8c76a"/></svg>',
  chest: '<svg viewBox="0 0 48 48"><path d="M6 20c0-7 5-11 18-11s18 4 18 11Z" fill="#c9782a"/><rect x="6" y="20" width="36" height="20" rx="3" fill="#a85f1c"/><rect x="6" y="20" width="36" height="4" fill="#FFC23D"/><rect x="20" y="18" width="8" height="10" rx="2" fill="#FFC23D"/><circle cx="24" cy="23" r="1.6" fill="#7a4210"/><circle cx="14" cy="13" r="2" fill="#fff3c4"/></svg>',
  loupe: '<svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12" fill="#fff3e3" stroke="#f0962a" stroke-width="4"/><path d="m29 29 10 10" stroke="#f0962a" stroke-width="5" stroke-linecap="round"/><text x="20" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#f0962a" font-family="sans-serif">?</text></svg>',

const taille = (svg, px) => svg.replace("<svg", `<svg style="width:${px}px;height:${px}px"`);

/* ---------- Types : un logo et une couleur chacun ---------- */
const ICO = {
  feu:'<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9Z" fill="#fff"/>',
  eau:'<path d="M12 3c3 5 6 8 6 12a6 6 0 0 1-12 0c0-4 3-7 6-12Z" fill="#fff"/>',
  plante:'<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Zm0 0 8-8" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>',
  elec:'<path d="M13 2 5 14h6l-1 8 8-12h-6Z" fill="#fff"/>',

  obscur:'<path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3Z" fill="#fff"/>',
  metal:'<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9Z" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="#fff"/>',
  fee:'<path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z" fill="#fff"/>',
  dragon:'<path d="M12 2 19 12 12 22 5 12Z" fill="#fff"/>',
  incolore:'<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7Z" fill="#fff"/>',
  dresseur:'<circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21a8 8 0 0 1 16 0Z" fill="#fff"/>',
  energie:'<circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 6v12M6 12h12" stroke="#fff" stroke-width="2.4"/>'
};
const TYPES = [
  {k:"Plante",c:"#4fae55",i:"plante"},{k:"Feu",c:"#ef6236",i:"feu"},{k:"Eau",c:"#3a8fe0",i:"eau"},
  {k:"Électrique",c:"#f2b90f",i:"elec"},{k:"Psy",c:"#a95ad1",i:"psy"},{k:"Combat",c:"#c06a35",i:"combat"},
  {k:"Obscurité",c:"#454a63",i:"obscur"},{k:"Métal",c:"#8693a4",i:"metal"},{k:"Fée",c:"#e57fb9",i:"fee"},
  {k:"Dragon",c:"#6a5cd6",i:"dragon"},{k:"Incolore",c:"#a9a395",i:"incolore"},
  {k:"Dresseur",c:"#6b7a90",i:"dresseur"},{k:"Énergie",c:"#2f9e98",i:"energie"}
];
const typeInfo = k => TYPES.find(t => t.k === k) || {k:k||"Autre",c:"#9aa3b5",i:"incolore"};
const tIco = (k, cls) => { const t = typeInfo(k); return `<span class="ti ${cls||""}" style="background:${t.c}" aria-hidden="true"><svg viewBox="0 0 24 24">${ICO[t.i]}</svg></span>`; };
const SANS = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function normType(t){
  const m = {plante:"Plante",grass:"Plante",feu:"Feu",fire:"Feu",eau:"Eau",water:"Eau",electrique:"Électrique",lightning:"Électrique",psy:"Psy",psychic:"Psy",combat:"Combat",fighting:"Combat",obscurite:"Obscurité",darkness:"Obscurité",metal:"Métal",fee:"Fée",fairy:"Fée",dragon:"Dragon",incolore:"Incolore",colorless:"Incolore",dresseur:"Dresseur",energie:"Énergie"};

function cote(pricing){

  [[W*.92,H*.15,90],[W*.15,H*1.05,110],[W*.65,H*1.2,70]].forEach(([x,y,rr]) => { g.beginPath(); g.arc(x,y,rr,0,7); g.fill(); });
  const etoile = (x,y,s,a) => { g.save(); g.translate(x,y); g.globalAlpha = a; g.fillStyle = "#FFE07A"; g.beginPath();
    for (let i = 0; i < 8; i++){ const rr = i % 2 ? s*.32 : s; const an = i * Math.PI / 4; g.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); }

  const cx = W - 70, cy = H - 14;

}

    <li><b>Le dos</b> : sur une vraie, le bleu est profond et net. Trop clair, violet ou flou : méfiance.</li>
    <li><b>Les mots</b> : fautes d'orthographe, accents manquants, police bizarre.</li>
    <li><b>Les PV et attaques</b> : des chiffres énormes (comme 1000 PV) n'existent pas.</li>
    <li><b>Le toucher</b> : trop fine, toute brillante, ou comme en plastique.</li>
    <li><b>La lampe</b> : lampe du téléphone derrière la carte ; une fausse laisse souvent passer beaucoup plus de lumière.</li>
    <li><b>Le numéro et le symbole</b> en bas : s'ils manquent, elle est très probablement fausse.</li>
    <li><b>Comparer</b> avec l'image de l'appli : couleurs ou dessin différents = suspect.</li></ul></details>`;
}

async function modifier(c, patch){
  Object.assign(c, patch); render(); if (S.detail === c.id) rendreDetail();
  const {id, ...data} = c;
  const {error} = await sb.from(TABLE).update({data, updated_at: new Date().toISOString()}).eq("id", id);
  if (error){ toast("Pas pu enregistrer : " + (error.message || "erreur")); charger(); }

$("fDetail").addEventListener("click", async e => {
  if (S.detail === "__voix"){
    if (e.target.closest("[data-close]")) return fermer("vDetail");
    const b = e.target.closest("[data-voix]"); if (!b) return;
    LS.set("pk_voix", b.dataset.voix);
    document.querySelectorAll("[data-voix]").forEach(x => x.setAttribute("aria-pressed", x === b));
    dire("Bonjour ! C'est moi qui vais te parler de tes cartes Pokémon.", voixFr().find(v => v.voiceURI === b.dataset.voix));
    return;
  }
  const c = S.cartes.find(x => x.id === S.detail); if (!c) return;
  if (e.target.closest("[data-close]")) return fermer("vDetail");
  if (S.ech && e.target.closest("#eAvec, #eContre")) return;
  if (e.target.closest("#dDire")) return dire(phrase(c));
  if (e.target.closest("#dEch")){ S.ech = {avec:"", contre:"", photo:true}; rendreDetail(); dire("Avec qui as-tu échangé ta carte ?"); setTimeout(() => { const el = $("eAvec"); el && el.scrollIntoView({block:"center"}); }, 50); return; }
  const cp = e.target.closest("[data-copain]"); if (cp){ S.ech.avec = cp.dataset.copain; S.ech.contre = $("eContre").value; S.ech.photo = $("ePhoto").checked; rendreDetail(); return; }
  if (e.target.closest("#eAnnuler")){ S.ech = null; rendreDetail(); return; }
  if (e.target.closest("#eOk")){
    const avec = $("eAvec").value.trim(), contre = $("eContre").value.trim(), photo = $("ePhoto").checked;
    const echanges = (c.echanges||[]).concat([{date: new Date().toISOString(), avec, contre}]);
    S.ech = null; await modifier(c, {qte: Math.max(0, c.qte - 1), echanges});
    dire("Échange enregistré !");
    if (photo){ fermer("vDetail"); ouvrirAjout({avec, contre: c.nom, date: new Date().toISOString(), contreQuoi: contre}); }
    else toast("Échange enregistré");
    return;
  }
  const v = e.target.closest("#dVf [data-v]"); if (v){ dire(VF[v.dataset.v].dit); return modifier(c, {vf: v.dataset.v}); }
  if (e.target.closest("#dPlus")){ dire(String(c.qte+1)); return modifier(c, {qte: c.qte + 1}); }
  if (e.target.closest("#dMoins")){ if (c.qte > 1 || (c.qte === 1 && (c.echanges||[]).length)){ dire(String(c.qte-1)); modifier(c, {qte: c.qte - 1}); } else if (c.qte === 1){ S.confirmSuppr = true; rendreDetail(); } return; }
  if (e.target.closest("#dSuppr")){
    if (!S.confirmSuppr){ S.confirmSuppr = true; rendreDetail(); return; }
    S.cartes = S.cartes.filter(x => x.id !== c.id); fermer("vDetail"); render();
    const {error} = await sb.from(TABLE).delete().eq("id", c.id);
    if (error){ toast("Pas pu enlever la carte"); charger(); } else toast(`${c.nom} enlevée`);
    return;
  }
  const m = e.target.closest("#dMaj");
  if (m){ m.disabled = true;
    try { const f = await ficheComplete(c.cardId); await modifier(c, {cote: f.cote, coteLe: f.coteLe, rarete: f.rarete || c.rarete, rang: f.rang}); toast(f.cote ? "Cote mise à jour" : "Pas de cote pour cette carte"); }
    catch(err){ toast("Impossible de joindre le site des cartes"); rendreDetail(); } }
});

/* Photo réduite sur le téléphone, puis envoyée à la fonction pokemon-scan (IA Claude) */
function reduire(file){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const m = 1400, k = Math.min(1, m / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      ok(cv.toDataURL("image/jpeg", .85));
    };
    im.onerror = () => { URL.revokeObjectURL(url); ko(new Error("image")); };
    im.src = url;
  });
}
const ERREURS = {cle_manquante:"La clé de l'IA n'est pas encore installée (parents : voir Supabase).", cle_invalide:"La clé de l'IA n'est pas bonne (parents).", credit:"Plus de crédit sur le compte de l'IA (parents).", acces:"Ce compte n'a pas accès à la reconnaissance.", lecture:"L'IA n'a pas réussi à lire la carte. Reprends la photo.", reseau:"Le service n'arrive pas à joindre l'IA. Réessaie."};
async function analyser(file){
  A.etape = "analyse"; A.err = ""; A.lu = null;
  try { A.photo = typeof file === "string" ? file : await reduire(file); } catch(e){ A.etape = "oups"; A.err = "Je n'arrive pas à ouvrir cette photo."; rendreAjout(); return; }
  rendreAjout(); dire("Je regarde ta carte");
  let lu;
  try {
    const {data, error} = await sb.functions.invoke("pokemon-scan", {body: {image: A.photo.split(",")[1], media_type: "image/jpeg"}});
    if (error){ let code = "", st = ""; try { st = error.context && error.context.status; const j = await error.context.json(); code = j.error + (j.status ? " " + j.status : ""); } catch(e){ code = code || (error.name || "") + " " + (error.message || ""); }
      throw new Error((ERREURS[String(code).split(" ")[0]] || "L'IA ne répond pas. Réessaie.") + ` (code : ${code || st || "?"})`); }
    lu = data && data.carte;
  } catch(e){ A.etape = "oups"; A.err = e.message; rendreAjout(); dire("Oups. Réessaie."); return; }
  if (!lu || !lu.est_carte){ A.etape = "oups"; A.err = "Je ne vois pas de carte. Mets-la bien à plat, dans la lumière."; rendreAjout(); dire("Je ne vois pas de carte. Réessaie."); return; }
  A.lu = lu; A.vf = VF[lu.authenticite] ? lu.authenticite : "vraie";
  try { A.cands = await candidats(lu); } catch(e){ A.cands = []; }
  if (!A.cands.length){ A.etape = "oups"; A.err = `J'ai lu « ${lu.nom || "?"} » mais je ne trouve pas cette carte.`; rendreAjout(); dire("Je ne trouve pas cette carte. Réessaie."); return; }
  A.retour = A.cands.length > 1 ? "choix" : "photo";
  if (A.cands.length === 1) choisir(A.cands[0]);
  else { A.etape = "choix"; rendreAjout(); $("fAjout").scrollTop = 0; dire("Laquelle est ta carte ? Touche celle qui est pareille."); }
}
/* Retrouver la carte dans la base TCGdex à partir de ce que l'IA a lu */
async function candidats(lu){
  const lang = ["fr","en","de","es","it"].includes(lu.langue) ? lu.langue : "fr";
  const base = String(lu.nom_base || lu.nom || "").replace(/[^\p{L}\p{N}' -]/gu, " ").replace(/\s+/g, " ").trim();
  const mot = base.split(" ").sort((a,b) => b.length - a.length)[0] || base;
  const num = lu.numero ? String(lu.numero).trim() : "";
  const numN = parseInt(num.replace(/^\D+/, ""), 10);
  const total = parseInt(lu.total, 10);
  let res = [];
  for (const q of [base, mot]){
    if (!q || q.length < 2) continue;
    try { res = await api(`/cards?name=${encodeURIComponent(q)}&pagination:itemsPerPage=250`, lang); } catch(e){ res = []; }
    if (Array.isArray(res) && res.length) break;
  }
  if (!Array.isArray(res) || !res.length) return [];
  let parNum = num ? res.filter(r => SANS(r.localId) === SANS(num) || (!isNaN(numN) && parseInt(String(r.localId).replace(/^\D+/, ""), 10) === numN)) : [];
  if (parNum.length > 1 && !isNaN(total) && parNum.length <= 12){
    const det = await Promise.all(parNum.map(r => api("/cards/" + encodeURIComponent(r.id), lang).catch(() => null)));
    const ok = parNum.filter((r,i) => det[i] && det[i].set && det[i].set.cardCount && [det[i].set.cardCount.official, det[i].set.cardCount.total].includes(total));
    if (ok.length) parNum = ok;
  }
  const liste = (parNum.length ? parNum : res.slice().reverse()).slice(0, 24);
  return liste.map(r => ({id: r.id, name: r.name, localId: r.localId, image: r.image ? r.image.replace(/\/(en|de|es|it)\//, "/fr/") : null}));
}
async function choisir(b){
  A.choix = b; A.qte = 1; A.etape = "confirm"; rendreAjout(); $("fAjout").scrollTop = 0;
  try { b.fiche = await ficheComplete(b.id); b.name = b.fiche.nom || b.name; if (b.fiche.image) b.image = b.fiche.image; } catch(e){}
  if (A.choix === b){ rendreAjout(); const d = S.cartes.find(c => c.cardId === b.id); if (b.fiche) dire(`C'est ${b.fiche.nom} ? ${sorte(b.fiche)}.` + (d && d.qte > 0 ? " Tu l'as déjà ! Ce sera un double." : "")); }
}

let flux = null;

async function ouvrirViseur(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ montrerFeuillePhoto(); return; }
  try {
    flux = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1440}}, audio: false});
  } catch(e){ montrerFeuillePhoto(); return; }
  const v = $("vid"); v.srcObject = flux; $("viseur").classList.add("on");
  try { await v.play(); } catch(e){}
  dire("Mets ta carte dans le cadre, puis appuie sur le bouton rouge.");
}
function fermerViseur(){
  $("viseur").classList.remove("on");
  if (flux){ flux.getTracks().forEach(t => t.stop()); flux = null; }
  $("vid").srcObject = null;
}
function montrerFeuillePhoto(){ A.etape = "photo"; rendreAjout(); $("vAjout").classList.add("on"); }
function photographier(){
  const v = $("vid"), vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return;
  /* la vidéo est affichée en « cover » : on retrouve la zone du cadre dans l'image réelle, avec une petite marge */
  const el = v.getBoundingClientRect(), c = $("cadre").getBoundingClientRect();
  const s = Math.max(el.width / vw, el.height / vh), ox = (el.width - vw * s) / 2, oy = (el.height - vh * s) / 2;
  const m = .08 * c.width;
  let sx = (c.left - m - el.left - ox) / s, sy = (c.top - m - el.top - oy) / s, sw = (c.width + 2*m) / s, sh = (c.height + 2*m) / s;
  sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
  const k = Math.min(1, 1400 / Math.max(sw, sh));
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  cv.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const f = $("vFlash"); f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 60);
  const url = cv.toDataURL("image/jpeg", .88);
  setTimeout(() => { fermerViseur(); $("vAjout").classList.add("on"); analyser(url); }, 180);
}
$("vDeclic").onclick = photographier;
$("vFermer").onclick = () => { fermerViseur(); if (A.recue) montrerFeuillePhoto(); };
$("vAlbum").onclick = () => { fermerViseur(); $("album").click(); };
$("vNom").onclick = () => { fermerViseur(); A.etape = "nom"; A.lu = null; A.vf = "vraie"; rendreAjout(); $("vAjout").classList.add("on"); setTimeout(() => $("aQ") && $("aQ").focus(), 200); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && flux) fermerViseur(); });

async function chercherNom(){
  const q = A.q.trim(); if (q.length < 2){ A.res = []; rendreNom(); return; }
  A.charge = true; A.err = ""; rendreNom();
  const moi = chercherNom._n = (chercherNom._n || 0) + 1;
  try { const r = await api(`/cards?name=${encodeURIComponent(q)}&pagination:itemsPerPage=250`); if (moi !== chercherNom._n) return; A.res = (Array.isArray(r) ? r : []).reverse(); }
  catch(e){ if (moi !== chercherNom._n) return; A.res = []; A.err = "Impossible de joindre le site des cartes."; }
  A.charge = false; rendreNom();
}
function rendreNom(){
  if (A.etape !== "nom") return;
  const focus = document.activeElement && document.activeElement.id, vq = $("aQ") && $("aQ").value, vn = $("aNum") && $("aNum").value;
  rendreAjout();
  if (vq != null) $("aQ").value = vq;
  if (vn != null) $("aNum").value = vn;
  if (focus && $(focus)){ const el = $(focus); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch(e){} }
}
$("camera").onchange = $("album").onchange = e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (f){ $("vAjout").classList.add("on"); analyser(f); }
};
$("fAjout").addEventListener("input", e => {
  if (e.target.id === "aQ"){ A.q = e.target.value; clearTimeout(chercherNom._t); chercherNom._t = setTimeout(chercherNom, 450); }
  if (e.target.id === "aNum"){ A.numero = e.target.value; clearTimeout(rendreNom._t); rendreNom._t = setTimeout(rendreNom, 250); }
});
$("fAjout").addEventListener("click", e => {
  const T = s => e.target.closest(s);
  if (T("[data-close]")) return fermer("vAjout");
  if (T("[data-dire]")) return dire(T("[data-dire]").dataset.dire);
  if (T("#aCam") || T("#aRe")){ fermer("vAjout"); return ouvrirViseur(); }
  if (T("#aAlbum")) return $("album").click();
  if (T("#aNom")){ A.etape = "nom"; A.lu = null; A.vf = "vraie"; rendreAjout(); setTimeout(() => $("aQ") && $("aQ").focus(), 200); return; }
  if (T("#aRetourPhoto")){ A.etape = "photo"; rendreAjout(); return; }
  const r = T("#aRes [data-id]");
  if (r){ const src = A.etape === "choix" ? A.cands : A.res; const b = src.find(x => x.id === r.dataset.id); if (b){ A.retour = A.etape; choisir(Object.assign({}, b)); } return; }
  if (T("#aDire")){ const t = A.choix && A.choix.fiche; dire(t ? phrase(Object.assign({}, t, {vf: A.vf, qte: A.qte})) : A.choix && A.choix.name); return; }
  const v = T("#aVf [data-v]"); if (v){ A.vf = v.dataset.v; dire(VF[A.vf].dit); rendreAjout(); return; }
  if (T("#aPlus")){ A.qte++; dire(String(A.qte)); rendreAjout(); return; }
  if (T("#aMoins")){ A.qte = Math.max(1, A.qte - 1); dire(String(A.qte)); rendreAjout(); return; }
  if (T("#aPasCa")){ A.choix = null; A.etape = A.retour || "photo"; rendreAjout(); return; }
  if (T("#aOk")) ajouter();
});
async function ajouter(){
  const b = A.choix; if (!b || A.charge) return;
  A.charge = true; rendreAjout();
  let f = b.fiche;
  if (!f){ try { f = await ficheComplete(b.id); } catch(e){ f = {cardId:b.id, nom:b.name, image:b.image||null, numero:String(b.localId||""), serie:"", serieId:"", total:null, rarete:"", rang:0, type: A.lu && A.lu.type ? normType(A.lu.type) : "Incolore", pv: A.lu && A.lu.pv || null, cote:null, coteLe:null}; } }
  if (!f.image && A.photo){ try { f.photo = await vignette(A.photo); } catch(e){} }
  const existe = S.cartes.find(c => c.cardId === b.id);
  const recue = A.recue ? {avec: A.recue.avec, contre: A.recue.contre, date: A.recue.date} : null;
  if (existe){
    const patch = {qte: existe.qte + A.qte, cote: f.cote || existe.cote};
    if (!existe.image && f.image) patch.image = f.image;
    if (!existe.image && !existe.photo && f.photo) patch.photo = f.photo;
    if (ORDRE_VF.indexOf(A.vf) > ORDRE_VF.indexOf(existe.vf)) patch.vf = A.vf; /* on garde la note la plus prudente */
    if (recue) patch.recue = recue;
    await modifier(existe, patch);
  } else {
    const data = Object.assign({}, f, {qte: A.qte, vf: A.vf, ajout: new Date().toISOString()}, recue ? {recue} : {});
    const {data: row, error} = await sb.from(TABLE).insert({data}).select("id,data").single();
    if (error){ A.charge = false; rendreAjout(); toast("Pas pu ajouter : " + (error.message || "erreur")); return; }
    S.cartes.push(Object.assign({}, row.data, {id: row.id}));
  }
  const double = !!(existe && existe.qte > A.qte);
  A.charge = false; A.recue = null; fermer("vAjout"); render(); feter(f, double);
}

function vignette(dataUrl){
  return new Promise((ok, ko) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 360 / im.naturalWidth), cv = document.createElement("canvas");
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); ok(cv.toDataURL("image/jpeg", .72)); };
    im.onerror = ko; im.src = dataUrl; });
}
/* ---------- Fête ---------- */
function feter(f, encore){
  $("feteImg").src = imgUrl(f.image, "high") || f.photo || "logo.svg"; $("feteImg").onerror = function(){ imgSecours(this); };
  $("feteEt").innerHTML = etoiles(f.rang);
  $("feteTitre").textContent = encore ? "Un double !" : "Nouvelle carte !";
  $("fete").classList.add("on");
  dire((encore ? "Un double ! Tu pourras l'échanger. " : "Bravo, nouvelle carte ! ") + f.nom + ".");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), g = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#FFC23D","#E5483B","#3D74E8","#4fae55","#e57fb9","#fff"];
  const pts = Array.from({length: 120}, () => ({x: W/2, y: H*.4, vx: (Math.random()-.5)*14, vy: -Math.random()*14 - 4, s: 5 + Math.random()*6, r: Math.random()*6, c: cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function anim(t){
    g.clearRect(0,0,W,H);
    pts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .15; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); });
    if (t - t0 < 2600 && $("fete").classList.contains("on")) requestAnimationFrame(anim); else g.clearRect(0,0,W,H);
  })(t0);
}
$("feteOk").onclick = () => $("fete").classList.remove("on");

/* ---------- Événements ---------- */
function fermer(id){ $(id).classList.remove("on"); if (id === "vDetail") S.detail = null; }
["vAjout","vDetail"].forEach(id => $(id).addEventListener("click", e => { if (e.target.id === id) fermer(id); }));
document.addEventListener("keydown", e => { if (e.key === "Escape"){ fermer("vAjout"); fermer("vDetail"); $("fete").classList.remove("on"); } });
$("fab").onclick = () => ouvrirAjout();
$("q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("qVide").onclick = () => { S.q = ""; $("q").value = ""; render(); $("q").focus(); };
document.querySelector(".wrap").addEventListener("click", e => {
  const vu = e.target.closest("[data-vue]"); if (vu){ const k = vu.dataset.vue; S.vue = S.vue === k ? "tout" : k; render(); dire(S.vue === "doubles" ? "Mes doubles" : S.vue === "echanges" ? "Mes échanges" : "Toutes mes cartes"); return; }
  const t = e.target.closest("[data-tri]"); if (t){ S.tri = t.dataset.tri; LS.set("pk_tri", S.tri); render(); return; }
  const ty = e.target.closest("[data-type]"); if (ty){ S.type = ty.dataset.type || null; render(); dire(S.type || "Tous les types"); return; }
  const vf = e.target.closest("[data-vf]"); if (vf){ const k = vf.dataset.vf; S.vf = S.vf === k && k !== "toutes" ? "toutes" : k; render(); if (VF[S.vf]) dire(VF[S.vf].dit); return; }
  const c = e.target.closest(".tuile, .stat.top"); if (c) ouvrirDetail(c.dataset.id);
});

/* ---------- Cotes : mises à jour tous les 3 jours ---------- */
const dejaEssaye = new Set();
async function majCotes(toutes){
  const vieux = S.cartes.filter(c => toutes || !c.coteLe || (!c.image && !dejaEssaye.has(c.id) && dejaEssaye.add(c.id)) || Date.now() - new Date(c.coteLe).getTime() > 3*864e5);
  if (!vieux.length){ if (toutes) toast("Les cotes sont déjà à jour"); return; }
  if (toutes) toast(`Mise à jour de ${vieux.length} cote${vieux.length>1?"s":""}…`);
  let i = 0, ok = 0;
  const w = async () => { while (i < vieux.length){ const c = vieux[i++];
    try { const f = await ficheComplete(c.cardId); await modifier(c, Object.assign({cote: f.cote || c.cote, coteLe: f.coteLe, rarete: c.rarete || f.rarete, rang: c.rarete ? c.rang : f.rang}, !c.image && f.image ? {image: f.image} : {})); ok++; } catch(e){} } };
  await Promise.all([w(), w(), w()]);
  if (toutes) toast(ok ? "Cotes mises à jour" : "Impossible de joindre le site des cartes");
}

/* ---------- Ouverture ---------- */
(function(){
  const sp = $("splash"); let vu = false;
  try { vu = sessionStorage.getItem("pkSplash") === "1"; sessionStorage.setItem("pkSplash","1"); } catch(e){}
  const t0 = Date.now(), min = vu ? 0 : 1300;
  window.cacherSplash = () => { setTimeout(() => { sp.classList.add("hide"); setTimeout(() => sp.remove(), 600); }, Math.max(0, min - (Date.now() - t0))); };
  if (vu) window.cacherSplash();
  setTimeout(window.cacherSplash, 3500);
})();

/* ---------- Connexion (même compte que Films & séries et Notre cave) ---------- */
function showGate(html){ $("gateBox").innerHTML = html; $("gate").classList.add("on"); window.cacherSplash(); }
function sbErr(m){ m = m || ""; return /Invalid login/i.test(m) ? "E-mail ou mot de passe incorrect." : /fetch|Failed|JSON/i.test(m) ? "Pas de connexion : vérifie le réseau." : /rate|seconds/i.test(m) ? "Trop d'essais : réessaie dans quelques minutes." : m; }
function gateLogin(mode){
  mode = mode || "login";
  showGate(`<h2>Mes cartes</h2><p>${mode === "login" ? "Connecte-toi avec le même compte que Films &amp; séries." : "Tu vas recevoir un lien pour choisir un mot de passe."}</p>
  <label for="gMail">E-mail</label><input id="gMail" type="email" autocomplete="email" autocapitalize="off" value="${esc(LS.get("last_email") || "")}">
  ${mode === "login" ? `<label for="gPass">Mot de passe</label><input id="gPass" type="password" autocomplete="current-password">` : ""}
  <div class="err" id="gErr"></div>
  <button class="btn bleu" id="gGo">${mode === "login" ? "Se connecter" : "Recevoir le lien"}</button>
  <button class="lnk" id="gAlt">${mode === "login" ? "Mot de passe oublié" : "J'ai un mot de passe"}</button>`);
  $("gAlt").onclick = () => gateLogin(mode === "login" ? "forgot" : "login");
  const go = async () => {
    const em = $("gMail").value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(em)){ $("gErr").textContent = "Saisis ton e-mail."; return; }
    LS.set("last_email", em); $("gGo").disabled = true; $("gErr").textContent = "";
    let r;
    if (mode === "login"){ r = await sb.auth.signInWithPassword({email: em, password: $("gPass").value}); if (!r.error){ user = r.data.user; demarrer(); return; } }
    else { r = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname}); if (!r.error){ $("gErr").style.color = "var(--ok)"; $("gErr").textContent = "E-mail envoyé : ouvre le lien reçu."; $("gGo").disabled = false; return; } }
    $("gErr").style.color = ""; $("gErr").textContent = sbErr(r.error && r.error.message); $("gGo").disabled = false;
  };
  $("gGo").onclick = go; const p = $("gPass"); if (p) p.onkeydown = e => { if (e.key === "Enter") go(); };
}
function gateNewPassword(){
  showGate(`<h2>Nouveau mot de passe</h2><p>6 caractères minimum.</p><label for="gNew">Mot de passe</label><input id="gNew" type="password" autocomplete="new-password"><div class="err" id="gErr"></div><button class="btn bleu" id="gGo">Enregistrer</button>`);
  $("gGo").onclick = async () => { const {error} = await sb.auth.updateUser({password: $("gNew").value}); if (error){ $("gErr").textContent = sbErr(error.message); return; } demarrer(); };
}
function gateMessage(titre, texte){ showGate(`<h2>${titre}</h2><p>${texte}</p><button class="btn sec" id="gOut">Se déconnecter</button>`); $("gOut").onclick = deconnecter; }
async function deconnecter(){ try { await sb.auth.signOut(); } catch(e){} LS.set("pk_cache", null); location.reload(); }

function appliquer(rows){
  S.cartes = rows.map(r => { const c = Object.assign({qte:1, vf:"vigilance", rang:0, type:"Incolore", nom:"", serie:"", rarete:"", echanges:[]}, r.data, {id: r.id});
    c.vf = normVF(c.vf); c.qte = Math.max(0, parseInt(c.qte, 10) || 0); return c; });
  render(); if (S.detail && S.detail !== "__voix" && !S.ech) rendreDetail();
}
async function charger(){
  const {data, error} = await sb.from(TABLE).select("id,data");
  if (error){ toast(sbErr(error.message)); return; }
  appliquer(data || []); LS.set("pk_cache", JSON.stringify(data || []));
}
async function demarrer(){
  const {data: ok, error} = await sb.rpc("is_pokemon_member");
  if (error && /fetch|Failed|network/i.test(error.message || "")){ gateMessage("Pas de connexion", "Impossible de joindre la base. Vérifie le réseau puis rouvre l'appli."); return; }
  if (error){ gateMessage("Base pas prête", `Il manque la table des cartes dans Supabase (script <code>pokemon/supabase.sql</code>).<br><small>${esc(error.message || "")}</small>`); return; }
  if (!ok){ gateMessage("Accès aux cartes", `Ce compte (${esc(user && user.email)}) n'a pas encore accès. Ajoute son e-mail dans la table <code>pokemon_members</code> de Supabase.`); return; }
  $("gate").classList.remove("on");
  $("compte").innerHTML = `<button type="button" id="choixVoix">Choisir la voix</button><button type="button" id="majTout">Mettre à jour toutes les cotes</button><span>Cotes : moyenne des ventes Cardmarket · cartes TCGdex · photos lues par Claude</span><span>Connecté : ${esc(user.email)} · <button id="logout" type="button">Se déconnecter</button></span>`;
  $("logout").onclick = deconnecter; $("majTout").onclick = () => majCotes(true); $("choixVoix").onclick = ouvrirVoix;
  await charger(); window.cacherSplash();
  try { sb.channel("pokemon").on("postgres_changes", {event:"*", schema:"public", table:TABLE}, () => { clearTimeout(demarrer._t); demarrer._t = setTimeout(charger, 400); }).subscribe(); } catch(e){}
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") charger(); });
  majCotes(false);
}

(async () => {
  try { const c = JSON.parse(LS.get("pk_cache") || "null"); if (Array.isArray(c)) appliquer(c); } catch(e){}
  render();
  try { speechSynthesis.getVoices(); } catch(e){}
  if (!window.supabase){ gateMessage("Connexion impossible", "La bibliothèque Supabase ne s'est pas chargée. Vérifie la connexion et recharge."); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "PASSWORD_RECOVERY"){ user = session && session.user; gateNewPassword(); } });
  const {data: {session}} = await sb.auth.getSession();
  if (location.hash.includes("type=recovery")) return;
  if (!session){ gateLogin("login"); return; }
  user = session.user; demarrer();
})();

if ("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
}
