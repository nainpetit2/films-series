<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Films & séries">
<meta name="theme-color" content="#17121C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Films & séries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE6; --card:#FFFFFF; --ink:#1A1520; --muted:#857B70; --line:#E4DDD2;
  --accent:#C8322F; --accent-soft:#F8E2DF; --gold:#E2A93B; --ok:#2E7D52; --ok-soft:#E0F0E6; --warn:#A86A12;
  --night:#17121C; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
body{padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* top band */
.top{position:relative;background:var(--night);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 0 18px;overflow:hidden;border-radius:0 0 26px 26px}
.top:before{content:"";position:absolute;inset:-40% -20% auto auto;width:420px;height:420px;background:radial-gradient(closest-side,rgba(200,50,47,.55),transparent);pointer-events:none}
.top:after{content:"";position:absolute;left:-120px;bottom:-160px;width:360px;height:360px;background:radial-gradient(closest-side,rgba(226,169,59,.22),transparent);pointer-events:none}
header{position:relative;padding:0 20px;z-index:1}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:36px;margin:4px 0 0;letter-spacing:.2px;line-height:1}
h1 span{color:var(--gold);font-style:italic}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 11px;font-size:12px;color:rgba(255,255,255,.7)}
.stat b{display:block;font-size:18px;color:#fff;font-weight:700;line-height:1.1}
.tabs{position:relative;z-index:1;display:flex;gap:4px;margin:18px 20px 0;background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 0;border-radius:11px;font-weight:600;color:rgba(255,255,255,.6)}
.tabs button.on{background:#fff;color:var(--ink)}
/* resume rail */
.sec-t{font-family:"DM Serif Display",serif;font-size:21px;padding:20px 20px 0}
.rail{display:flex;gap:12px;overflow-x:auto;padding:12px 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rc{flex:none;width:270px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);display:flex;gap:12px;padding:10px;box-shadow:0 2px 10px rgba(26,21,32,.07);border:0;text-align:left}
.rc .poster{width:62px;flex:none;border-radius:10px}
.rc .i{flex:1;min-width:0;display:flex;flex-direction:column}
.rc .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .nx{font-size:12px;color:var(--muted);margin-top:2px}
.rc .nx b{color:var(--ink)}
.rc .prog{margin-top:auto}
.rc .go{margin-top:8px;align-self:flex-start;border:0;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
/* filters */
.bar{display:flex;gap:8px;align-items:center;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar.plat{padding-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.55;font-weight:500}
.chip .pd{width:9px;height:9px;border-radius:3px;flex:none}
.plat .chip{font-size:12px;padding:6px 11px}
.plat .chip.on{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink))}
.plat .chip.on .pd{background:#fff!important}
.search{margin:12px 20px 0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px 10px 36px;outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
.aibar{margin:14px 20px 0;display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#2A1D33,#4A1D2A);color:#fff;border-radius:14px;padding:11px 12px;font-size:13px}
.aibar span{flex:1}
.aibar button{border:0;background:#fff;color:var(--ink);font-weight:700;font-size:12px;border-radius:999px;padding:7px 11px;white-space:nowrap}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:16px 20px}
.card{background:transparent;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.poster{aspect-ratio:2/3;width:100%;position:relative;background:#ddd;overflow:hidden;border-radius:var(--r)}
.card .poster{box-shadow:0 10px 24px -10px rgba(26,21,32,.45),0 2px 4px rgba(26,21,32,.08);transition:transform .15s}
.card:active .poster{transform:scale(.97)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .shade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(10,8,12,.7))}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-family:"DM Serif Display",serif;font-size:21px;line-height:1.08}
.ph:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.ph small{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.gen{position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.25) 50%,rgba(255,255,255,0) 70%);background-size:250% 100%;animation:sh 1.4s infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.badge{position:absolute;left:8px;bottom:8px;color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;background:rgba(20,18,16,.7);backdrop-filter:blur(6px);letter-spacing:.02em}
.my{position:absolute;top:8px;left:8px;background:rgba(20,16,22,.72);backdrop-filter:blur(6px);color:var(--gold);font-weight:800;font-size:12px;padding:4px 7px;border-radius:8px}
.seen{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.meta{padding:9px 2px 0}
.t{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.y{color:var(--muted);font-size:12px;margin-top:2px}
.rates{display:flex;gap:9px;margin-top:5px;font-size:12px;font-weight:700;flex-wrap:wrap}
.rates span{display:inline-flex;align-items:center;gap:4px}
.dotA{width:8px;height:8px;border-radius:2px;background:#F3C316;display:inline-block}
.dotR{width:8px;height:8px;border-radius:50%;background:#FA320A;display:inline-block}
.prog{height:5px;background:#E9E3D9;border-radius:3px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#E0603A);border-radius:3px}
.prog.done i{background:var(--ok)}
.pl{font-size:11px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:46px 30px}
.empty b{display:block;color:var(--ink);font-family:"DM Serif Display",serif;font-weight:400;font-size:23px;margin-bottom:6px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);height:58px;padding:0 22px 0 18px;border-radius:29px;border:0;background:linear-gradient(135deg,#D63A33,#A8232A);color:#fff;font-weight:700;box-shadow:0 10px 26px -6px rgba(200,50,47,.55);display:flex;align-items:center;gap:8px;z-index:5}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,14,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93vh;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.backdrop{position:absolute;left:0;right:0;top:0;height:300px;overflow:hidden;border-radius:24px 24px 0 0;pointer-events:none}
.backdrop div{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.75;transform:scale(1.1)}
.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(23,18,28,.35),rgba(23,18,28,.15) 40%,var(--bg))}
.grab{position:relative;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.6);margin:8px auto 4px;z-index:1}
.sh{position:relative;padding:6px 18px 0;z-index:1}
.sh h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:26px;margin:6px 0 14px}
.close{position:absolute;right:14px;top:12px;border:0;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:18px 0 7px;text-transform:uppercase;letter-spacing:.08em}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;outline:none}
.in:focus{border-color:var(--ink)}
.seg{display:flex;background:#E8E2D8;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--ink);color:#fff;width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:linear-gradient(135deg,#D63A33,#A8232A)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid #EFC9C4}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hero{display:flex;gap:16px;align-items:flex-end;padding-top:18px}
.hero .poster{width:124px;flex:none;border-radius:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.55)}
.hero .info{flex:1;min-width:0;padding-bottom:4px}
.hero .tt{font-family:"DM Serif Display",serif;font-size:26px;line-height:1.05}
.hero .ot{color:#5E554C;font-size:13px;margin-top:5px}
.syn{font-size:14px;color:#4A433C;margin-top:14px;line-height:1.5}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.ai{background:#FFF7E6;border:1px solid #F0DFB6;color:#7A5A12;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px;display:flex;gap:10px;align-items:center}
.ai .sp{width:16px;height:16px;border:2px solid #E2C783;border-top-color:#7A5A12;border-radius:50%;animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rbox small{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rbox input{border:0;outline:none;width:100%;font-size:22px;font-weight:800;padding:2px 0 0;background:transparent}
.rbox .u{font-size:13px;color:var(--muted);font-weight:500}
.rnote{font-size:12px;color:var(--muted);margin-top:7px}
.rnote.est{color:var(--warn)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.paste{border:2px dashed #D5CEC3;border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;background:var(--card);min-height:52px;outline:none;-webkit-user-select:text;user-select:text}
.paste:focus{border-color:var(--accent);color:var(--ink)}
.season{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.shd{display:flex;align-items:center;gap:10px;padding:11px 12px}
.shd .nm{font-weight:700;flex:1}
.shd .cnt{font-size:12px;color:var(--muted)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #CFC7BB;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.part{background:var(--ok-soft);border-color:var(--ok)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding:0 12px 12px}
.ep{border:1px solid var(--line);background:#FAF8F4;border-radius:9px;height:38px;font-weight:700;font-size:13px;color:var(--muted);padding:0}
.ep.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tog{border:0;background:transparent;color:var(--muted);padding:4px;display:flex}
.sedit{display:flex;gap:8px;align-items:center;padding:0 12px 12px;font-size:13px;color:var(--muted)}
.sedit input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.sedit button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;margin-left:auto}
.bigprog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bigprog .l{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bigprog .prog{height:9px;margin-top:8px}
.danger{background:transparent;border:0;color:var(--accent);font-weight:600;padding:14px;width:100%;margin-top:10px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:30;max-width:88vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{margin:14px 20px 0;padding:10px 12px;border-radius:12px;background:#FFF7E6;border:1px solid #F0DFB6;color:#7A5A12;font-size:13px}
.hidden{display:none!important}
.stars{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.star{position:relative;width:38px;height:38px;border:0;background:transparent;padding:0;flex:none;touch-action:manipulation}
.star svg{position:absolute;inset:0;width:100%;height:100%}
.star .fg{clip-path:inset(0 calc(100% - var(--f)) 0 0)}
.stars .val{margin-left:auto;font-weight:800;font-size:18px}
.stars .val small{font-size:12px;color:var(--muted);font-weight:500}
.mine{color:#B07A12}

.gear{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center}
.backdrop.real div{filter:none;opacity:1;inset:0;transform:none;background-position:center 20%}
.backdrop.real{height:260px}
.backdrop.real:after{background:linear-gradient(rgba(23,18,28,.15),rgba(243,238,230,.35) 55%,var(--bg))}
.sh.hasbd{padding-top:120px}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.prov .p{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;font-size:12.5px;font-weight:600}
.prov .p img{width:26px;height:26px;border-radius:7px}
.prov .p small{color:var(--muted);font-weight:500}
.jw{font-size:11px;color:var(--muted);margin-top:8px}
.res{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ri{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;width:100%}
.ri img,.ri .noimg{width:46px;height:69px;border-radius:8px;object-fit:cover;flex:none;background:#E6DFD4}
.ri .t{font-size:14.5px}
.ri .y{font-size:12px}
.ri .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-left:auto;flex:none;align-self:flex-start;padding-top:4px}
.ri .tag.tv{color:#2B59F2}
.ri.has{opacity:.55}
.gate{position:fixed;inset:0;z-index:40;background:var(--night);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px 26px calc(env(safe-area-inset-bottom) + 32px);overflow:auto}
.gate:before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;background:radial-gradient(closest-side,rgba(200,50,47,.5),transparent);pointer-events:none}
.gate .box{position:relative;max-width:420px;width:100%;margin:0 auto}
.gate h1{font-size:40px}
.gate p{color:rgba(255,255,255,.7);font-size:14.5px;line-height:1.5}
.gate label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:18px 0 7px}
.gate .in{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.gate .in::placeholder{color:rgba(255,255,255,.35)}
.gate .btn{margin-top:18px;background:#fff;color:var(--ink)}
.gate .lnk{background:transparent;border:0;color:rgba(255,255,255,.7);margin-top:14px;font-weight:600;width:100%}
.gate .err{color:#FF9C8F;font-size:13px;margin-top:10px;min-height:18px}
.code{letter-spacing:.4em;text-align:center;font-size:22px;font-weight:700}
.nextair{display:inline-flex;margin-top:8px;font-size:12px;font-weight:700;color:#2B59F2;background:#E4EBFE;border-radius:999px;padding:5px 10px}
.mini{font-size:12px;color:var(--muted)}
.tmdb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:18px;line-height:1.4}

.dotT{width:8px;height:8px;border-radius:2px;background:#01B4E4;display:inline-block}
.dotI{width:8px;height:8px;border-radius:2px;background:#F5C518;display:inline-block}
</style>
</head>
<body>
<div class="top">

<header>
  <div class="kicker">Ma watchlist</div>
  <h1>Films <span>&amp;</span> séries</h1>
  <div class="stats" id="stats"></div>
</header>
<div class="tabs" id="tabs">
  <button data-t="film" class="on">Films</button>
  <button data-t="serie">Séries</button>
</div>
</div>
<div id="banner" class="banner hidden"></div>
<section id="resume" class="hidden"><div class="sec-t">Reprendre</div><div class="rail" id="rail"></div></section>
<div class="bar" id="filters"></div>
<div class="bar plat" id="plats"></div>
<div class="search hidden" id="searchWrap">

  <input id="q" placeholder="Rechercher dans ma liste…" autocomplete="off">
</div>
<div class="grid" id="grid"></div>
<div class="empty hidden" id="empty"></div>

<button class="fab" id="fab" aria-label="Ajouter"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="backdrop" id="backdrop"></div><div class="grab"></div><button class="close" id="close" aria-label="Fermer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sh" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div class="gate hidden" id="gate"><div class="box" id="gateBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
